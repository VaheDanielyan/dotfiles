[env]
TERM = "alacritty"

[window]
decorations = "Buttonless"
opacity = 1
dynamic_padding = true
startup_mode = "Maximized"
title = "Alacritty"
option_as_alt = "Both"

[scrolling]
history = 100000

[font]
size = 10
[font.normal]
family = "ComicCode"
style = "regular"
[font.bold]
family = "ComicCode"
style = "Bold"
[font.italic]
family = "ComicCode"
style = "Italic"
[font.bold_italic]
family = "ComicCode"
style = "Bold Italic"
[font.offset]
x = 0
y = 1

# Default colors
[colors.primary]
# hard contrast background = = '#1d2021'
background = '#282828'
# soft contrast background = = '#32302f'
foreground = '#ebdbb2'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Bright colors
[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

#[colors]
#draw_bold_text_with_bright_colors = false
#[colors.primary]
#background = "0x282C34"
#foreground = "0xabb2bf"
#bright_foreground = "0xe6efff"
#[colors.normal]
#black = "0x1e2127"
#red = "0xe06c75"
#green = "0x98c379"
#yellow = "0xd19a66"
#blue = "0x61afef"
#magenta = "0xc678dd"
#cyan = "0x56b6c2"
#white = "0x828791"
