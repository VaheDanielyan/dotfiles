[env]
TERM = "alacritty"

[window]
decorations = "Buttonless"
opacity = 0.95
dynamic_padding = true
startup_mode = "Maximized"
title = "Alacritty"
option_as_alt = "Both"

[scrolling]
history = 100000

[font]
size = 15
[font.normal]
family = "ComicCode Nerd Font Mono"
style = "Regular"
[font.bold]
family = "ComicCode Nerd Font Mono"
style = "Bold"
[font.italic]
family = "ComicCode Nerd Font Mono"
style = "Italic"
[font.bold_italic]
family = "ComicCode Nerd Font Mono"
style = "Bold Italic"
#[font.offset]
#x = 0
#y = 1

# Default colors
#[colors.primary]
## hard contrast background = = '#1d2021'
#background = '#282828'
## soft contrast background = = '#32302f'
#foreground = '#ebdbb2'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'
#
## Bright colors
[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

#[colors]
#draw_bold_text_with_bright_colors = false
#[colors.primary]
#background = "0x282C34"
#foreground = "0xabb2bf"
#bright_foreground = "0xe6efff"
#[colors.normal]
#black = "0x1e2127"
#red = "0xe06c75"
#green = "0x98c379"
#yellow = "0xd19a66"
#blue = "0x61afef"
#magenta = "0xc678dd"
#cyan = "0x56b6c2"
#white = "0x828791"
#[colors.bright]
#black = "0x5c6370"
#red = "0xe06c75"
#green = "0x98c379"
#yellow = "0xd19a66"
#blue = "0x61afef"
#magenta = "0xc678dd"
#cyan = "0x56b6c2"
#white = "0xe6efff"
#[colors.dim]
#black = "0x1e2127"
#red = "0xe06c75"
#green = "0x98c379"
#yellow = "0xd19a66"
#blue = "0x61afef"
#magenta = "0xc678dd"
#cyan = "0x56b6c2"
#white = "0x828791"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[[keyboard.bindings]]
key = "Key0"
mods = "Super"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Super"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Super"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Super"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "F11"
mods = "None"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Paste"
mods = "None"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
mods = "None"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "None"
action = "ScrollPageUp"
mode = "~Alt"

[[keyboard.bindings]]
key = "PageDown"
mods = "None"
action = "ScrollPageDown"
mode = "~Alt"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
action = "ScrollToTop"
mode = "~Alt"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
action = "ScrollToBottom"
mode = "~Alt"
